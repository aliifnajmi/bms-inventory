<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BMS Base Schedule | BMS SUPERAPPS</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--ink:#1b2430;--mute:#5f6b7a;--line:#dfe4ea;--accent:#1f5fbf;--accent-ink:#fff;--hl:#fff3b0;--head:#eaeff5}
@media (prefers-color-scheme:dark){:root{--bg:#121820;--card:#1a222d;--ink:#e6ebf1;--mute:#9aa6b4;--line:#2b3644;--accent:#5b9bf0;--accent-ink:#0c1117;--hl:#5a4b00;--head:#222c39}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header.top h1{font-size:20px;margin:0}
header.top .crumb{color:var(--mute);font-size:13px}
header.top a.back{margin-left:auto;color:var(--accent);text-decoration:none;font-weight:600}
.layout{display:grid;grid-template-columns:330px 1fr;gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel h2{margin:0;padding:12px 14px 0;font-size:15px}
.panel .sub{padding:2px 14px 10px;color:var(--mute);font-size:12.5px}
.search{padding:0 14px 12px}
.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.search input:focus-visible,.tabs button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.floors{max-height:calc(100vh - 220px);overflow:auto;border-top:1px solid var(--line)}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
thead th{position:sticky;top:0;background:var(--head);font-size:12.5px;z-index:1}
.floors td:nth-child(2){font-weight:600}
.zone-row td{background:var(--head);color:var(--mute);font-size:12px;font-weight:600;padding:4px 12px}
.tabs{display:flex;gap:6px;padding:12px 14px 0;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 14px;border-radius:6px;font:inherit;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bar{display:flex;gap:12px;align-items:center;padding:12px 14px;flex-wrap:wrap}
.bar .search{flex:1;min-width:220px;padding:0}
.count{color:var(--mute);font-size:12.5px}
.scroll{overflow-x:auto;max-height:calc(100vh - 230px);overflow-y:auto;border-top:1px solid var(--line)}
.scroll table{min-width:760px}
td.pre{white-space:pre-line}
td.num{text-align:right;width:56px}
mark{background:var(--hl);color:inherit;padding:0 1px;border-radius:2px}
.empty{padding:28px;text-align:center;color:var(--mute)}
.note{padding:10px 14px;color:var(--mute);font-size:12.5px;border-top:1px solid var(--line)}
.toggle{display:none}
@media (max-width:900px){
 .layout{grid-template-columns:1fr}
 .floors{max-height:60vh}
 .scroll{max-height:none}
}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase();
function hi(text,q){
  const t=esc(text); if(!q) return t;
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');
  return t.replace(re,'<mark>$1</mark>');
}
/* ---- Floor table ---- */
const fb=document.getElementById('fb');
function renderFloors(){
  const q=document.getElementById('qf').value.trim();
  let html='',last='',n=0;
  D.floors.forEach(f=>{
    if(q && !norm(f.slice(0,2).join(' ')).includes(norm(q))) return;
    if(f[2]!==last){html+=`<tr class="zone-row"><td colspan="2">${esc(f[2])}</td></tr>`;last=f[2];}
    html+=`<tr><td>${hi(f[0],q)}</td><td>${hi(f[1],q)}</td></tr>`;n++;
  });
  fb.innerHTML=n?html:'<tr><td colspan="2" class="empty">Tiada tingkat dijumpai</td></tr>';
}
document.getElementById('qf').addEventListener('input',renderFloors);

/* ---- Base Schedule table (Sheet1 intentionally excluded) ---- */
const th=document.getElementById('th'),tb=document.getElementById('tb'),cnt=document.getElementById('cnt'),note=document.getElementById('note');
function render(){
  const q=document.getElementById('q').value.trim();
  const rows=D.base.filter(r=>!q||norm(r.join(' ')).includes(norm(q)));
  th.innerHTML='<tr><th>No</th><th>Resource</th><th>Base Schedule</th><th>Resource Assignment</th><th>Location (Marketing)</th><th>Qty</th></tr>';
  tb.innerHTML=rows.length?rows.map(r=>`<tr><td>${r[0]}</td><td>${hi(r[1],q)}</td><td class="pre">${hi(r[2],q)}</td><td class="pre">${hi(r[3],q)}</td><td class="pre">${hi(r[4],q)}</td><td class="num">${r[5]}</td></tr>`).join(''):`<tr><td colspan="6" class="empty">Tiada keputusan untuk "${esc(q)}"</td></tr>`;
  cnt.textContent=rows.length+' rekod';
  note.textContent='Sumber: BMS SCHEDULES & RESOURCES. Sheet1 tidak digunakan. Kolum Location menggunakan Marketing Floor.';
}
document.getElementById('q').addEventListener('input',render);
renderFloors();render();
