<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMS IMS — Browser Demo (GitHub Pages)</title>
  <meta name="description" content="BMS Inventory Management System — browser demo. Data is stored locally in your browser (localStorage).">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230d2433'/%3E%3Cpath d='M8 20l4-6 4 4 8-9' stroke='%2310b981' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <style>
    .demo-badge {
      display: inline-block; margin: 10px 16px 0; padding: 3px 11px; border-radius: 999px;
      font-size: 10.5px; font-weight: 700; letter-spacing: .06em;
      background: rgba(16, 185, 129, .14); color: #34d399; border: 1px solid rgba(16, 185, 129, .45);
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-row">
          <div class="logo">BMS</div>
          <div>
            <h1>BMS IMS</h1>
            <p>Inventory &amp; Stock Control</p>
          </div>
        </div>
      </div>
      <div class="demo-badge">BMS IMS · PHONE READY · DATA SAVED ON THIS DEVICE</div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        BMS IMS v1.0.0 — GitHub Pages<br>Data stored on this device only
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu"></button>
        <h2 id="pageTitle">Dashboard</h2>
        <div class="topbar-spacer"></div>
        <div class="topbar-user">
          <div class="avatar">BT</div>
          <div class="who"><strong>BMS Technician</strong><span>Store Operations</span></div>
        </div>
      </header>
      <main class="content" id="content">
        <div class="loading">Loading…</div>
      </main>
      <footer class="footer">
        BMS IMS — Building Management System Inventory &amp; Stock Control · GitHub Pages browser demo
      </footer>
    </div>
  </div>

  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/charts.js"></script>
  <script src="js/local-backend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
